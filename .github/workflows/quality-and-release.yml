name: Quality and release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Run Vitest (20-second limit)
        run: timeout 20s npm --prefix frontend run test

  php-tests:
    name: PHP tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Run PHPUnit (20-second limit)
        run: timeout 20s composer test

  production-build:
    name: Production build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build

  release-label:
    name: Release version label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require one release version label
        shell: bash
        run: |
          set -euo pipefail
          count="$(jq '[.pull_request.labels[].name | select(. == "patch" or . == "minor" or . == "major")] | length' "$GITHUB_EVENT_PATH")"
          if [[ "$count" != 1 ]]; then
            printf 'Add exactly one release label to this PR: patch, minor, or major.\n' >&2
            exit 1
          fi

  deploy-merge:
    name: Deploy merged main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend-tests, php-tests, production-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - name: Package the exact merged source and frontend build
        id: package
        shell: bash
        run: |
          set -euo pipefail
          associated_pull_requests="$RUNNER_TEMP/associated-pull-requests.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" > "$associated_pull_requests"
          merged_pr="$(jq -ce --arg sha "$GITHUB_SHA" '[.[] | select(.base.ref == "main" and .merged_at != null and .merge_commit_sha == $sha)] | if length == 1 then .[0] else error("expected exactly one merged PR for this commit") end' "$associated_pull_requests")"
          release_type="$(jq -er '[.labels[].name | select(. == "patch" or . == "minor" or . == "major")] | if length == 1 then .[0] else error("merged PR must have exactly one release label") end' <<< "$merged_pr")"

          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          existing_tags=()
          while IFS= read -r existing_tag; do
            [[ "$existing_tag" =~ $semver_pattern ]] && existing_tags+=("$existing_tag")
          done < <(git tag --points-at "$GITHUB_SHA")
          if (( ${#existing_tags[@]} > 1 )); then
            printf 'More than one SemVer tag already points to this commit.\n' >&2
            exit 1
          elif (( ${#existing_tags[@]} == 1 )); then
            tag=${existing_tags[0]}
          else
            latest_tag='v0.0.0'
            while IFS= read -r candidate; do
              [[ "$candidate" =~ $semver_pattern ]] && latest_tag=$candidate
            done < <(git tag --list | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V || true)
            IFS=. read -r major minor patch <<< "${latest_tag#v}"
            case "$release_type" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            tag="v${major}.${minor}.${patch}"
          fi

          package_dir="$RUNNER_TEMP/release-package"
          archive="$RUNNER_TEMP/sandbox-php-${tag}.tar.gz"
          mkdir -p "$package_dir"
          git archive "$GITHUB_SHA" | tar -x -C "$package_dir"
          rm -rf -- "$package_dir/.specs" "$package_dir/.github" "$package_dir/tests"
          rm -rf -- "$package_dir/public/assets/vendor"
          rm -f -- "$package_dir/AGENTS.md"
          mkdir -p "$package_dir/public/assets/build"
          cp -a public/assets/build/. "$package_dir/public/assets/build/"
          printf '%s\n%s\n' "$tag" "$GITHUB_SHA" > "$package_dir/.deploy-release"
          shopt -s dotglob nullglob
          package_entries=("$package_dir"/*)
          for index in "${!package_entries[@]}"; do
            package_entries[$index]="${package_entries[$index]##*/}"
          done
          tar -czf "$archive" -C "$package_dir" -- "${package_entries[@]}"
          chmod +x tools/verify-deploy-package.sh
          tools/verify-deploy-package.sh "$archive" "$tag" "$GITHUB_SHA"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$GITHUB_SHA" ]] || {
              printf 'The calculated release tag already points to a different commit.\n' >&2
              exit 1
            }
          else
            git tag -a "$tag" "$GITHUB_SHA" -m "$tag"
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" --target "$GITHUB_SHA" --title "$tag" --notes "Automated production release for $GITHUB_SHA."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          known_hosts_target="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != 22 ]]; then
            known_hosts_target="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -F "$known_hosts_target" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            printf 'DEPLOY_KNOWN_HOSTS has no host-key entry for %s. Configure the verified host key using this exact host and port.\n' "$known_hosts_target" >&2
            exit 1
          fi
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      - name: Transfer and deploy the tagged release
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.package.outputs.archive }}"
          tag="${{ steps.package.outputs.tag }}"
          remote_package="/tmp/sandbox-php-${tag}.tar.gz"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" "$archive" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_package}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- '${tag}' '${remote_package}'" <<'REMOTE'
          set -euo pipefail
          tag=$1
          package=$2
          work=$(mktemp -d /tmp/sandbox-php-deploy.XXXXXX)
          trap 'rm -rf -- "$work"; rm -f -- "$package"' EXIT
          tar -xOzf "$package" tools/deploy-shared-hosting.sh > "$work/deploy-shared-hosting.sh"
          tar -xOzf "$package" tools/verify-deploy-package.sh > "$work/verify-deploy-package.sh"
          bash "$work/deploy-shared-hosting.sh" --release "$tag" --package "$package" --target "$HOME/sites/sandbox-php"
          REMOTE
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

  deploy-selected-tag:
    name: Deploy selected tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Download and validate the published package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(release-[0-9]+-[0-9]+-[0-9a-f]{12}|v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          archive="$RUNNER_TEMP/sandbox-php-${RELEASE_TAG}.tar.gz"
          gh release download "$RELEASE_TAG" --pattern "sandbox-php-${RELEASE_TAG}.tar.gz" --dir "$RUNNER_TEMP"
          tools/verify-deploy-package.sh "$archive" "$RELEASE_TAG" "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Install SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          known_hosts_target="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != 22 ]]; then
            known_hosts_target="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -F "$known_hosts_target" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            printf 'DEPLOY_KNOWN_HOSTS has no host-key entry for %s. Configure the verified host key using this exact host and port.\n' "$known_hosts_target" >&2
            exit 1
          fi
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      - name: Transfer and deploy the selected release
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.package.outputs.archive }}"
          tag="${{ inputs.release_tag }}"
          remote_package="/tmp/sandbox-php-${tag}.tar.gz"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" "$archive" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_package}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- '${tag}' '${remote_package}'" <<'REMOTE'
          set -euo pipefail
          tag=$1
          package=$2
          work=$(mktemp -d /tmp/sandbox-php-deploy.XXXXXX)
          trap 'rm -rf -- "$work"; rm -f -- "$package"' EXIT
          tar -xOzf "$package" tools/deploy-shared-hosting.sh > "$work/deploy-shared-hosting.sh"
          tar -xOzf "$package" tools/verify-deploy-package.sh > "$work/verify-deploy-package.sh"
          bash "$work/deploy-shared-hosting.sh" --release "$tag" --package "$package" --target "$HOME/sites/sandbox-php"
          REMOTE
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
